name: Build a sidecar

# A sidecar is a helper program the panel starts as a process (the OpenFlux exit). The panel release carries a
# pinned build of each; this workflow builds a newer one from a reviewed upstream commit, publishes it as the
# release sidecar-<name>-<version>-<n> and records it in the signed sidecars.json, which servers read and
# verify before they replace the file. It is run by hand only. Publishing also needs the repository variable
# PUBLISH_ENABLED=true and the secret BUILDS_SIGNING_KEY.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "The program"
        required: true
        type: choice
        options: [openflux]
        default: openflux
      version:
        description: "Upstream tag, for example v0.13.0"
        required: true
        type: string
      commit:
        description: "The full SHA of the commit that tag points at (the one that was reviewed)"
        required: true
        type: string
      publish:
        description: "Publish the release and update the signed sidecars.json"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sidecars
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      publish: ${{ steps.release.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ inputs.name }}
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Pick the release
        id: release
        env:
          WANT_PUBLISH: ${{ inputs.publish }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          publish=false
          if [ "$WANT_PUBLISH" = "true" ]; then
            if [ "$PUBLISH_ENABLED" = "true" ]; then publish=true; else echo "::warning::publish was asked for but PUBLISH_ENABLED is not true; building only"; fi
          fi
          prefix="sidecar-${NAME}-${VERSION}-"
          last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | awk -v p="$prefix" 'index($0, p) == 1 { n = substr($0, length(p) + 1); if (n ~ /^[0-9]+$/ && n + 0 > max) max = n + 0 } END { print max + 0 }')
          echo "release=sidecar-${NAME}-${VERSION}-$((last + 1))" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Test the build scripts
        run: bash tests/sidecar_test.sh
      - name: Build both architectures from the commit
        run: scripts/build-sidecar.sh "$NAME" "$VERSION" "$COMMIT" out
      - name: Check the static binaries
        run: |
          set -euo pipefail
          for a in amd64 arm64; do file "out/${NAME}-linux-$a" | grep -q "statically linked"; done
          cat out/*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sidecar
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ inputs.name }}
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
      RELEASE: ${{ needs.build.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sidecar
          path: dl
      - name: Release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$RELEASE already exists; a release is never changed" >&2
            exit 1
          fi
          {
            echo "${NAME} ${VERSION}, built for the LucX-UI plugin system's servers."
            echo
            echo "Not a standalone install: the sync agent on a server downloads it after checking the signed sidecars.json on the builds branch."
            echo
            echo "- amd64: \`$(cat dl/${NAME}-linux-amd64.sha256)\`"
            echo "- arm64: \`$(cat dl/${NAME}-linux-arm64.sha256)\`"
            echo
            echo "Source: the upstream tag ${VERSION}, commit ${COMMIT}; built by scripts/build-sidecar.sh of https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA} (CGO off, -trimpath). ${NAME} is GPL-3.0-or-later software of its authors; this release only builds their source unchanged. See LICENSING.md."
          } > notes.md
          gh release create "$RELEASE" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --title "$RELEASE" --notes-file notes.md \
            "dl/${NAME}-linux-amd64" "dl/${NAME}-linux-arm64"
      - name: Update and sign sidecars.json
        env:
          BUILDS_SIGNING_KEY: ${{ secrets.BUILDS_SIGNING_KEY }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            rm -rf site
            if git ls-remote --exit-code --heads origin builds > /dev/null 2>&1; then
              git clone --quiet --branch builds --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
            else
              git init --quiet -b builds site
              git -C site remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            fi
            scripts/sidecar-list.sh "$NAME" "$VERSION" "$COMMIT" "$RELEASE" dl site
            git -C site add sidecars.json sidecars.json.sig
            git -C site -c user.name="lucx-plugins build" -c user.email="actions@users.noreply.github.com" commit --quiet -m "Sidecar ${RELEASE}"
            if git -C site push --quiet origin builds; then exit 0; fi
            echo "push raced, retrying ($attempt)"
            sleep $((attempt * 3))
          done
          echo "could not publish sidecars.json" >&2
          exit 1

  notify:
    needs: [build, publish]
    if: always() && needs.build.outputs.publish == 'true' && (needs.build.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update an issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Sidecar release failed"
          gh label create build-failure -R "$GITHUB_REPOSITORY" --color B60205 --description "An automatic build failed" 2> /dev/null || true
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --label build-failure --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "Failed again: ${RUN_URL}"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label build-failure --body "A sidecar release failed: ${RUN_URL}"
          fi
