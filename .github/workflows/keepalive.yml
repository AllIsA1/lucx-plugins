name: Keep the schedule alive

# GitHub switches scheduled workflows off after 60 days without repository activity.
# Enabling the build workflow again resets that timer.

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/enable"
